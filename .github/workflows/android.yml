name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Unit, lint and Android builds
    runs-on: ubuntu-latest
    env:
      # app/build.gradle.kts permits an unsigned Release variant only in CI;
      # local/release publishing still requires the configured keystore.
      CI: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Make Gradle wrapper executable
        shell: bash
        run: chmod +x gradlew

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: JVM unit tests
        shell: bash
        run: ./gradlew test --stacktrace --no-daemon --console=plain --continue

      - name: Summarize JVM test failures
        if: always()
        shell: bash
        run: |
          shopt -s nullglob globstar
          failed=0
          reports=(app/build/test-results/**/*.xml core/**/build/test-results/**/*.xml)
          for report in "${reports[@]}"; do
            suite=$(grep -m1 '<testsuite ' "$report" || true)
            [[ -z "$suite" ]] && continue
            failures=$(sed -n 's/.*failures="\([0-9][0-9]*\)".*/\1/p' <<< "$suite")
            errors=$(sed -n 's/.*errors="\([0-9][0-9]*\)".*/\1/p' <<< "$suite")
            if [[ "${failures:-0}" != "0" || "${errors:-0}" != "0" ]]; then
              echo "::error file=$report,title=JVM test suite failed::failures=${failures:-0} errors=${errors:-0} report=$report"
              failed=1
            fi
          done
          if [[ "$failed" == "0" ]]; then
            echo "No failed JVM test suites were found in the generated XML reports."
          fi

      - name: Android lint
        run: ./gradlew lintDebug --stacktrace

      - name: Debug build
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Release variant build
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Upload Gradle reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shinefs-gradle-reports-${{ github.run_id }}
          path: |
            app/build/test-results/**
            core/**/build/test-results/**
            app/build/reports/**
            core/**/build/reports/**
          if-no-files-found: warn
